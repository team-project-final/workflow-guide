<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synapse 가이드 매니저</title>

<!-- Pretendard for Korean UI, JetBrains Mono for numerics -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ---------- Theme tokens (default: graphite light) ---------- */
  :root {
    --bg:          #f4f2ec;
    --panel:       #fbfaf6;
    --panel-2:     #ffffff;
    --rule:        #1a1a1a14;
    --rule-2:      #1a1a1a0c;
    --ink:         #14161a;
    --ink-2:       #14161acc;
    --mute:        #14161a80;
    --mute-2:      #14161a55;
    --accent:      #d94b3b;   /* signal red */
    --accent-ink:  #ffffff;
    --accent-soft: #d94b3b18;
    --accent-line: #d94b3b66;
    --heat-min:    #14161a08;
    --heat-max:    #d94b3b;
    --grid-line:   #14161a14;
    --chip-bg:     #14161a08;
    --chip-bg-on:  #14161a;
    --chip-ink-on: #fbfaf6;
    --shadow:      0 1px 0 #14161a08, 0 8px 24px -16px #14161a22;
  }
  :root[data-theme="dark"] {
    --bg:          #0c0d10;
    --panel:       #131418;
    --panel-2:     #181a1f;
    --rule:        #ffffff14;
    --rule-2:      #ffffff0c;
    --ink:         #ecedee;
    --ink-2:       #ecedeecc;
    --mute:        #ecedee80;
    --mute-2:      #ecedee55;
    --accent:      #ff6b4a;
    --accent-ink:  #0c0d10;
    --accent-soft: #ff6b4a20;
    --accent-line: #ff6b4a66;
    --heat-min:    #ffffff08;
    --heat-max:    #ff6b4a;
    --grid-line:   #ffffff14;
    --chip-bg:     #ffffff10;
    --chip-bg-on:  #ecedee;
    --chip-ink-on: #0c0d10;
    --shadow:      0 1px 0 #00000040, 0 12px 32px -16px #00000080;
  }
  :root[data-accent="teal"]    { --accent:#0ea5a5; --accent-ink:#fff; --accent-soft:#0ea5a522; --accent-line:#0ea5a566; --heat-max:#0ea5a5; }
  :root[data-accent="indigo"]  { --accent:#5b5be7; --accent-ink:#fff; --accent-soft:#5b5be722; --accent-line:#5b5be766; --heat-max:#5b5be7; }
  :root[data-accent="amber"]   { --accent:#d97706; --accent-ink:#fff; --accent-soft:#d9770622; --accent-line:#d9770666; --heat-max:#d97706; }
  :root[data-accent="lime"]    { --accent:#65a30d; --accent-ink:#fff; --accent-soft:#65a30d22; --accent-line:#65a30d66; --heat-max:#65a30d; }
  :root[data-theme="dark"][data-accent="teal"]   { --accent:#2dd4bf; --accent-ink:#0c0d10; --accent-soft:#2dd4bf22; --accent-line:#2dd4bf66; --heat-max:#2dd4bf; }
  :root[data-theme="dark"][data-accent="indigo"] { --accent:#a5b4fc; --accent-ink:#0c0d10; --accent-soft:#a5b4fc22; --accent-line:#a5b4fc66; --heat-max:#a5b4fc; }
  :root[data-theme="dark"][data-accent="amber"]  { --accent:#fbbf24; --accent-ink:#0c0d10; --accent-soft:#fbbf2422; --accent-line:#fbbf2466; --heat-max:#fbbf24; }
  :root[data-theme="dark"][data-accent="lime"]   { --accent:#a3e635; --accent-ink:#0c0d10; --accent-soft:#a3e63522; --accent-line:#a3e63566; --heat-max:#a3e635; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                 system-ui, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-feature-settings: "ss01","ss03","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-feature-settings: "tnum","zero"; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; background: none; border: none; padding: 0; }
  input:focus, button:focus { outline: none; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Layout shell ---------- */
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--rule);
  }
  .topbar-inner {
    display: grid;
    grid-template-columns: 280px 1fr auto;
    align-items: center;
    gap: 24px;
    padding: 14px 24px;
    max-width: 1640px; margin: 0 auto;
  }

  /* brand */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 32px; height: 32px;
    background: var(--ink); color: var(--bg);
    border-radius: 8px;
    display: grid; place-items: center;
    position: relative; overflow: hidden;
  }
  .brand-mark::after{
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 100% 100%, var(--accent) 0%, transparent 60%);
    opacity: .85;
  }
  .brand-mark svg { position: relative; z-index: 1; }
  .brand-text { line-height: 1.05; }
  .brand-text .t1 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-text .t2 { font-size: 11px; color: var(--mute); margin-top: 2px; }

  /* search */
  .search {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--rule);
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search input {
    flex: 1; min-width: 0; font-size: 14px;
  }
  .search input::placeholder { color: var(--mute-2); }
  .search .kbd {
    border: 1px solid var(--rule); padding: 2px 6px;
    border-radius: 5px; font-size: 11px; color: var(--mute);
    background: var(--panel-2);
  }
  .search-meta {
    font-size: 11px; color: var(--mute);
    border-left: 1px solid var(--rule);
    padding-left: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* top-right meta */
  .top-meta { display: flex; align-items: center; gap: 14px; }
  .top-meta .pulse {
    font-size: 11px; color: var(--mute);
    display: flex; align-items: center; gap: 6px;
  }
  .top-meta .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* main */
  main {
    max-width: 1640px; margin: 0 auto; width: 100%;
    padding: 24px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    align-items: start;
  }

  /* ---------- Sidebar ---------- */
  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 78px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 16px;
  }
  .panel h3 {
    margin: 0 0 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--mute);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel h3 .count { color: var(--ink-2); font-weight: 500; }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: var(--chip-bg);
    color: var(--ink-2);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, color .12s, transform .12s;
    user-select: none;
    border: 1px solid transparent;
  }
  .chip:hover { background: var(--rule); }
  .chip[aria-pressed="true"] {
    background: var(--chip-bg-on); color: var(--chip-ink-on);
  }
  .chip .n { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }

  .owner-list { display: flex; flex-direction: column; gap: 2px; }
  .owner-row {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
    gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer;
    font-size: 13px;
    transition: background .12s;
  }
  .owner-row:hover { background: var(--rule-2); }
  .owner-row[aria-pressed="true"] { background: var(--accent-soft); }
  .owner-row .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .owner-row .lbl { font-weight: 500; }
  .owner-row .lbl-sub { color: var(--mute); font-size: 11px; margin-left: 4px; }
  .owner-row .bar {
    height: 4px; width: 60px; border-radius: 2px;
    background: var(--rule); overflow: hidden;
  }
  .owner-row .bar > i { display: block; height: 100%; background: var(--accent); }
  .owner-row .num { font-size: 11px; color: var(--mute); width: 24px; text-align: right; }

  /* ---------- Content stack ---------- */
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-head .title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .panel-head .title .pill { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); letter-spacing: 0.04em; }
  .panel-head .sub { font-size: 11px; color: var(--mute); }

  /* segmented control */
  .seg {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--chip-bg); border-radius: 8px;
    font-size: 12px;
  }
  .seg button {
    padding: 4px 10px; border-radius: 6px;
    color: var(--mute); font-weight: 500;
    transition: background .12s, color .12s;
  }
  .seg button[aria-pressed="true"] {
    background: var(--panel-2); color: var(--ink);
    box-shadow: 0 1px 0 var(--rule), 0 1px 2px #00000010;
  }

  /* ---------- Matrix ---------- */
  .matrix-wrap { overflow-x: auto; }
  .matrix {
    width: 100%;
    border-collapse: separate; border-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .matrix th, .matrix td {
    padding: 0;
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
    vertical-align: top;
  }
  .matrix thead th {
    font-size: 11px; font-weight: 600; color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 10px 12px;
    background: transparent;
    text-align: left;
    border-bottom: 1px solid var(--rule);
  }
  .matrix thead th.week {
    text-align: center;
    color: var(--ink-2);
    position: relative;
  }
  .matrix thead th.week .wn { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; color: var(--ink); font-weight: 600; }
  .matrix thead th.week .ws { display: block; font-size: 10px; color: var(--mute); margin-top: 2px; letter-spacing: 0.08em; }
  .matrix tbody th {
    text-align: left;
    padding: 10px 12px;
    background: var(--panel-2);
    font-weight: 500; font-size: 13px;
    border-right: 1px solid var(--rule);
    width: 200px;
  }
  .matrix tbody th .who { display: flex; align-items: center; gap: 8px; }
  .matrix tbody th .who .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .matrix tbody th .nm { color: var(--mute); font-size: 11px; margin-left: 4px; font-weight: 400; }
  .matrix tbody td {
    background: var(--panel-2);
    height: 64px;
    position: relative;
    cursor: pointer;
    transition: outline .1s;
  }
  .matrix tbody td:hover { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }
  .matrix tbody tr:last-child th, .matrix tbody tr:last-child td { border-bottom: none; }
  .matrix th:last-child, .matrix td:last-child { border-right: none; }

  /* cell variants */
  .cell { width: 100%; height: 100%; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .cell .count-big {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px; font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .cell .count-big.empty { color: var(--mute-2); font-weight: 400; }
  .cell .meta {
    font-size: 10px; color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; gap: 6px;
  }
  .cell .bars {
    display: flex; gap: 2px; align-items: flex-end; height: 22px;
    margin-top: 4px;
  }
  .cell .bars i {
    flex: 1; min-width: 4px; background: var(--accent);
    border-radius: 1px;
    transition: opacity .15s;
  }
  /* heatmap fill is set inline via style on TD */
  .cell .count-on-heat { mix-blend-mode: difference; }

  /* col total row */
  .matrix tfoot th, .matrix tfoot td {
    padding: 8px 12px;
    border-top: 1px solid var(--rule);
    background: transparent;
    font-size: 11px; color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .matrix tfoot .tot {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px; color: var(--ink); font-weight: 600;
    text-transform: none; letter-spacing: 0;
  }

  /* ---------- Constellation strip ---------- */
  .constellation {
    background:
      radial-gradient(120% 100% at 0% 0%, var(--accent-soft) 0%, transparent 60%),
      var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 16px;
    position: relative; overflow: hidden;
  }
  .constellation .ribbon {
    position: relative;
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 12px;
    align-items: center;
  }
  .constellation .week-stack { display: flex; flex-direction: column; gap: 6px; font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; }
  .constellation-svg { width: 100%; display: block; }
  .constellation-legend { display: flex; gap: 14px; font-size: 11px; color: var(--mute); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); flex-wrap: wrap; }
  .constellation-legend .lg { display: flex; align-items: center; gap: 6px; }
  .constellation-legend .sw { width: 8px; height: 8px; border-radius: 2px; }

  /* ---------- Result list ---------- */
  .results-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
  }
  .results-head .left { display: flex; align-items: baseline; gap: 12px; }
  .results-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .results-head .n { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--mute); }
  .results-head .crumbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .crumb {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 11px;
    background: var(--accent-soft); color: var(--accent);
    cursor: pointer;
  }
  .crumb button.x { font-size: 12px; opacity: .6; }
  .crumb.clear-all { background: transparent; color: var(--mute); text-decoration: underline; }

  .list-head, .list-row {
    display: grid;
    grid-template-columns: 64px 120px 1fr 200px 100px;
    gap: 12px; align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule-2);
    font-size: 13px;
  }
  .list-head {
    font-size: 11px; color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--panel);
    border-radius: 14px 14px 0 0;
    border: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .list-head .sort { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .list-head .sort[aria-pressed="true"] { color: var(--ink); }
  .list-body {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-top: none;
    border-radius: 0 0 14px 14px;
    overflow: hidden;
  }
  .list-row {
    cursor: pointer; transition: background .12s;
    position: relative;
  }
  .list-row:hover { background: var(--rule-2); }
  .list-row:last-child { border-bottom: none; }
  .list-row .id-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--mute);
  }
  .list-row .id-tag .w { color: var(--accent); }
  .list-row .id-tag .s { color: var(--ink-2); }
  .list-row .owner-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .list-row .owner-cell .sw { width: 6px; height: 6px; border-radius: 1px; flex: none; }
  .list-row .owner-cell .ownt { font-size: 12px; font-weight: 500; }
  .list-row .owner-cell .ownsub { font-size: 11px; color: var(--mute); }
  .list-row .title-cell { min-width: 0; }
  .list-row .title-cell .ttl {
    font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-row .title-cell mark {
    background: var(--accent); color: var(--accent-ink);
    padding: 0 2px; border-radius: 2px;
  }
  .list-row .tags-cell { display: flex; gap: 4px; flex-wrap: wrap; overflow: hidden; }
  .list-row .tagchip {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--chip-bg); color: var(--ink-2);
    text-transform: lowercase; letter-spacing: 0.02em;
  }
  .list-row .open {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--mute);
    justify-self: end;
  }
  .list-row:hover .open { color: var(--accent); }

  .empty {
    padding: 60px 20px; text-align: center; color: var(--mute);
    background: var(--panel); border: 1px dashed var(--rule);
    border-radius: 14px;
  }
  .empty h4 { margin: 0 0 6px; color: var(--ink); font-size: 14px; }

  /* tag cloud */
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-cloud .chip { font-size: 11px; padding: 4px 8px; }

  /* dense mode */
  :root[data-density="compact"] .list-row { padding: 6px 16px; font-size: 12px; }
  :root[data-density="compact"] .matrix tbody td { height: 48px; }
  :root[data-density="compact"] .cell .count-big { font-size: 18px; }
  :root[data-density="compact"] .panel { padding: 12px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--mute-2); }

  /* clickable matrix labels */
  .matrix th.clickable { cursor: pointer; transition: background .12s, color .12s; user-select: none; }
  .matrix th.clickable:hover { background: var(--rule-2); color: var(--accent); }
  .matrix th.week.clickable.on { color: var(--accent); }
  .matrix th.week.clickable.on .wn { color: var(--accent); }
  .matrix tbody th.owner-th.clickable.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

  /* reset button */
  .reset-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-size: 12px; font-weight: 500;
    color: var(--ink-2);
    background: var(--panel);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s, opacity .12s;
  }
  .reset-btn:not(:disabled):hover { border-color: var(--accent-line); color: var(--accent); }
  .reset-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* grid layout for results */
  .grid-body {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
    margin-top: 4px;
  }
  .grid-card {
    display: flex; flex-direction: column;
    gap: 12px;
    padding: 14px 14px 12px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .12s, transform .12s, box-shadow .12s;
    min-height: 132px;
    position: relative;
    overflow: hidden;
  }
  .grid-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--owner-color, var(--accent));
    opacity: .9;
  }
  .grid-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); transform: translateY(-1px); }
  .grid-card-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .grid-card-top .owner-tag {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--mute); font-weight: 500;
  }
  .grid-card-top .owner-tag .sw { width: 7px; height: 7px; border-radius: 2px; }
  .grid-card-title {
    font-size: 13px; font-weight: 500; line-height: 1.45;
    color: var(--ink);
    flex: 1;
    text-wrap: pretty;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;

  /* compact density tightens grid cards */
  :root[data-density="compact"] .grid-card { padding: 10px 12px; min-height: 108px; }
