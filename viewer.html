<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가이드 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg:         #f8f7f4;
    --panel:      #ffffff;
    --ink:        #1a1a1a;
    --ink-2:      #1a1a1acc;
    --mute:       #8a8a8a;
    --rule:       #e8e6e1;
    --accent:     #0ea5a5;
    --accent-soft: rgba(14, 165, 165, 0.06);
    --accent-line: rgba(14, 165, 165, 0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg)
      repeating-radial-gradient(circle at 17% 32%, rgba(0,0,0,0.012) 0, transparent 1px)
      , repeating-radial-gradient(circle at 62% 78%, rgba(0,0,0,0.01) 0, transparent 1px)
      , repeating-radial-gradient(circle at 88% 12%, rgba(0,0,0,0.008) 0, transparent 1px);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont,
                 system-ui, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .vbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklab, var(--bg) 94%, transparent);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border-bottom: 1px solid var(--rule);
  }
  .vbar-inner {
    max-width: 1640px; margin: 0 auto;
    display: grid; grid-template-columns: auto 1fr auto; gap: 16px;
    align-items: center; padding: 8px 24px;
  }
  .vbar .back, .vbar .actions a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    background: var(--panel);
    transition: border-color .15s, color .15s;
    cursor: pointer;
  }
  .vbar .back:hover, .vbar .actions a:hover {
    border-color: var(--accent-line); color: var(--accent);
  }
  .vbar .crumb {
    font-size: 12px; color: var(--mute);
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .vbar .crumb .b {
    color: var(--ink-2); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vbar .crumb .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 600;
    font-family: ui-monospace, monospace;
    flex: none;
  }
  .vbar .actions { display: flex; gap: 8px; }

  /* iframe stage fills the rest of the viewport */
  .stage {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
    background: #ffffff;
    display: block;
  }

  /* loading overlay */
  .loader {
    position: fixed; top: 50px; left: 0; right: 0; bottom: 0;
    display: grid; place-items: center;
    background: var(--bg);
    transition: opacity .25s;
    z-index: 10;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .loader .spin {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--rule); border-top-color: var(--accent);
    animation: sp 0.8s linear infinite;
  }
  .loader .msg {
    margin-top: 12px; color: var(--mute); font-size: 13px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* error state */
  .err {
    position: fixed; inset: 50px 0 0 0;
    display: grid; place-items: center;
    background: var(--bg); padding: 24px;
    z-index: 20;
  }
  .err .card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 28px 32px; max-width: 520px;
    text-align: center;
  }
  .err h3 { margin: 0 0 8px; color: var(--ink); font-size: 16px; }
  .err p { margin: 0 0 14px; color: var(--mute); line-height: 1.55; }
  .err a.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--accent-line); color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
  }

  /* Reading progress bar */
  .progress-bar {
    position: fixed; top: 0; left: 0;
    height: 3px; width: 0%;
    background: var(--accent);
    z-index: 100;
    transition: width .15s ease-out;
    pointer-events: none;
  }

  /* Floating nav buttons */
  .fab-group {
    position: fixed; bottom: 28px; right: 28px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 60;
  }
  .fab-group a, .fab-group button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 0 0 1px var(--rule);
    color: var(--ink-2);
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    transition: background .15s, color .15s, box-shadow .15s;
    text-decoration: none;
  }
  .fab-group a:hover, .fab-group button:hover {
    background: rgba(255,255,255,0.92);
    color: var(--accent);
    box-shadow: 0 2px 12px rgba(14,165,165,0.15), 0 0 0 1px var(--accent-line);
  }
  .fab-group .fab-label {
    position: absolute; right: 50px;
    background: rgba(0,0,0,0.72); color: #fff;
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 500;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }
  .fab-group a:hover .fab-label,
  .fab-group button:hover .fab-label {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="progress-bar" id="progress-bar"></div>

<div class="vbar">
  <div class="vbar-inner">
    <a class="back" href="index.html">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M7 2 3 6l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>목록</span>
    </a>
    <div class="crumb" id="crumb"></div>
    <div class="actions">
      <a id="open-src" href="#" target="_blank" rel="noopener" title="원본 페이지를 새 탭으로 열기">
        <span>원본</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M3 3h4v4M7 3 3 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div style="text-align:center">
    <div class="spin"></div>
    <div class="msg">가이드 불러오는 중…</div>
  </div>
</div>

<iframe id="stage" class="stage" title="가이드 본문"></iframe>

<div class="fab-group">
  <a href="index.html" title="목록으로 돌아가기">
    <span class="fab-label">목록</span>
    <span>←</span>
  </a>
  <button id="fab-top" type="button" title="맨 위로 스크롤">
    <span class="fab-label">맨 위로</span>
    <span>↑</span>
  </button>
  <a id="fab-src" href="#" target="_blank" rel="noopener" title="원본 페이지">
    <span class="fab-label">원본</span>
    <svg width="14" height="14" viewBox="0 0 10 10" fill="none">
      <path d="M3 3h4v4M7 3 3 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</div>

<script>
  // ============================================================
  // Viewer: load the guide in an iframe, then inject CSS into the
  // iframe's document to hide the original site sidebar/header/footer.
  // Same-origin (gh-pages) → cross-frame DOM access works.
  // ============================================================
  const params = new URLSearchParams(location.search);
  const url = params.get('u');
  const stage  = document.getElementById('stage');
  const loader = document.getElementById('loader');
  const crumb  = document.getElementById('crumb');
  const openSrc = document.getElementById('open-src');

  function setCrumb(title) {
    let week = '', step = '';
    try {
      const m = url.match(/\/w(\d+)\/step(\d+)\//);
      if (m) { week = 'W' + m[1]; step = 'Step ' + m[2]; }
    } catch (e) {}
    crumb.innerHTML = '';
    if (week) {
      const p = document.createElement('span');
      p.className = 'pill';
      p.textContent = week + ' · ' + step;
      crumb.appendChild(p);
    }
    const t = document.createElement('span');
    t.className = 'b';
    t.textContent = title || '가이드';
    crumb.appendChild(t);
    document.title = (title || '가이드') + ' · Synapse 가이드 매니저';
  }

  function showError(msg) {
    const e = document.createElement('div');
    e.className = 'err';
    e.innerHTML =
      '<div class="card">' +
        '<h3>가이드를 불러올 수 없습니다</h3>' +
        '<p>' + msg + '</p>' +
        '<a class="btn" href="' + (url || '#') + '" target="_blank" rel="noopener">' +
          '원본 페이지로 이동 →' +
        '</a>' +
      '</div>';
    document.body.appendChild(e);
    loader.classList.add('hide');
  }

  // CSS injected into the guide iframe to hide the original site chrome
  // and let the inner <main.guide-body> take the full width.
  const INJECT_CSS = [
    /* Hide original site chrome */
    '.site-header,',
    '.site-sidebar,',
    '[data-sidebar],',
    '.site-footer,',
    '.site-nav-tabs,',
    '.site-nav-list,',
    '.site-search,',
    '.site-brand,',
    '.site-breadcrumb {',
    '  display: none !important;',
    '}',
    /* Reset body grid/flex layout used to position the sidebar */
    'body {',
    '  display: block !important;',
    '  grid-template-columns: none !important;',
    '  margin: 0 !important;',
    '  padding: 0 !important;',
    '}',
    /* Ensure the guide body fills the iframe */
    '.guide-body, main.guide-body {',
    '  margin: 0 !important;',
    '  width: 100% !important;',
    '  max-width: 100% !important;',
    '  display: block !important;',
    '}',
    /* Remove any leftover left margins from the sidebar layout */
    'main, .content, .container {',
    '  margin-left: 0 !important;',
    '  padding-left: max(24px, env(safe-area-inset-left)) !important;',
    '  padding-right: max(24px, env(safe-area-inset-right)) !important;',
    '}',
    /* Smooth top spacing now that the original header is gone */
    '.guide-body > header:first-child,',
    '.guide-body header.guide-header,',
    'main.guide-body > header:first-child {',
    '  padding-top: 28px !important;',
    '}',
  ].join('\n');

  function injectStyle() {
    try {
      const doc = stage.contentDocument || stage.contentWindow.document;
      if (!doc) throw new Error('iframe document unavailable');

      // Insert <style> into <head>
      const head = doc.head || doc.documentElement;
      const style = doc.createElement('style');
      style.id = '__viewer_strip__';
      style.textContent = INJECT_CSS;
      head.appendChild(style);

      // Pull page title for breadcrumb
      const title = (doc.querySelector('title') || {}).textContent || '';
      setCrumb(title.replace(/^WORKFLOW Guide\s*-\s*/, '').replace(/\s+\|\s+.*$/, '').trim());

      // Open external links in new tab so we don't trap user in the iframe
      doc.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href || href.startsWith('#')) return;
        a.target = '_top';
      });

      loader.classList.add('hide');
      attachScrollListener();
    } catch (err) {
      // Cross-origin or other access failure
      console.warn('viewer inject failed:', err);
      showError('가이드 페이지에 접근할 수 없습니다. (cross-origin 또는 권한 문제)');
    }
  }

  // Floating nav: keep fab-src in sync with openSrc
  const fabSrc = document.getElementById('fab-src');
  const fabTop = document.getElementById('fab-top');
  const progressBar = document.getElementById('progress-bar');

  // Scroll-to-top for iframe content
  fabTop.addEventListener('click', () => {
    try {
      const doc = stage.contentDocument || stage.contentWindow.document;
      if (doc) {
        doc.documentElement.scrollTop = 0;
        if (doc.scrollingElement) doc.scrollingElement.scrollTop = 0;
      }
    } catch (e) {
      stage.contentWindow.scrollTo(0, 0);
    }
  });

  // Reading progress bar based on iframe scroll
  function trackProgress() {
    try {
      const doc = stage.contentDocument || stage.contentWindow.document;
      if (!doc) return;
      const el = doc.scrollingElement || doc.documentElement;
      const scrollTop = el.scrollTop;
      const scrollHeight = el.scrollHeight - el.clientHeight;
      const pct = scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0;
      progressBar.style.width = pct + '%';
    } catch (e) {}
  }

  function attachScrollListener() {
    try {
      const win = stage.contentWindow;
      if (win) {
        win.addEventListener('scroll', trackProgress, { passive: true });
        // Also poll periodically as a fallback
        setInterval(trackProgress, 1000);
      }
    } catch (e) {}
  }

  function init() {
    if (!url) { showError('가이드 주소가 없습니다.'); return; }
    openSrc.href = url;
    fabSrc.href = url;
    setCrumb(''); // initial empty crumb

    stage.addEventListener('load', injectStyle);
    stage.addEventListener('error', () => showError('iframe 로드 실패'));

    // Safety timeout — if iframe never fires load
    setTimeout(() => {
      if (!loader.classList.contains('hide')) {
        // Try to inject anyway (some browsers don't fire load reliably for cached responses)
        try { injectStyle(); } catch (e) {}
      }
    }, 4000);

    stage.src = url;
  }

  init();
</script>
</body>
</html>
